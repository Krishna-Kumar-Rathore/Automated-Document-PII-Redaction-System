# ============================================================================
# Intelligent Document Redaction - central configuration
# Single source of truth. Every module reads from here; no magic numbers in code.
# Sections marked [PHASE N] are wired up in that phase.
# ============================================================================

paths:
  names_dir: "data/names"
  outputs_dir: "outputs"
  models_dir: "models"

# ---------------------------------------------------------------------------
# Preprocessing [PHASE 2]
# Conservative by default: PP-OCR generally prefers a natural image, so heavy
# binarisation is OFF. Every geometric op is tracked in an affine matrix so OCR
# boxes can be mapped back to ORIGINAL image coordinates.
# ---------------------------------------------------------------------------
preprocessing:
  upscale_if_small: true      # upscale when the longest side is below min_long_side
  min_long_side: 1000         # px; small scans OCR poorly
  max_long_side: 2600         # px; cap to keep inference fast
  denoise: true               # light bilateral filter (edge-preserving)
  deskew: true                # rotate to correct small skew
  deskew_min_angle: 0.3       # deg; ignore noise below this
  deskew_max_angle: 15.0      # deg; above this, assume detection error and skip

# ---------------------------------------------------------------------------
# OCR [PHASE 2]
# ---------------------------------------------------------------------------
ocr:
  engine: "rapidocr"          # swappable behind the OCREngine interface
  text_score: 0.5             # drop detections below this confidence
  # RapidOCR's bundled defaults are the Chinese+English ch_PP-OCRv4 det/rec models,
  # which sometimes drop spaces in tightly-spaced English ("DOB:01/01/1990").
  # Leave null to use them, or point to an English PP-OCR rec model here.
  det_model_path: null
  rec_model_path: null

# ---------------------------------------------------------------------------
# Text reconstruction [PHASE 3]
# Lines whose vertical extents overlap by >= row_overlap (fraction of the shorter
# line's height) are treated as one visual row and joined left -> right.
# ---------------------------------------------------------------------------
reconstruction:
  row_overlap: 0.5
  row_separator: " "          # between lines on the same row ("\n" between rows)

# ---------------------------------------------------------------------------
# Entity registry [PHASE 4+]
# Configurable so classes can be added without touching code.
# `validators` only BOOST confidence when a structured pattern matches; a
# document without valid formats (e.g. a newspaper) is still handled.
# ---------------------------------------------------------------------------
entities:
  registry:
    - PERSON_NAME
    - PHONE_NUMBER
    - EMAIL
    - URL
    - UPI_ID
    - ADDRESS
    - ORGANIZATION
    - DATE
    - ID_NUMBER
    - ACCOUNT_NUMBER
    - OTHER_PII

# ---------------------------------------------------------------------------
# Regex detectors [PHASE 4]  (patterns live in code module, tunables here)
# ---------------------------------------------------------------------------
# Each pattern emits an EntityCandidate with its base confidence. If the pattern
# has a validator and it is enabled, a PASS adds validator_boost and a FAIL
# subtracts validator_penalty - the candidate is still emitted (OCR may have
# garbled a digit), so the resolver / eval can decide. Validators never gate.
# ---------------------------------------------------------------------------
regex:
  # pattern key -> entity label:  EMAIL, PHONE_NUMBER, URL, UPI_ID, DATE,
  # AADHAAR -> ID_NUMBER, PAN -> ID_NUMBER, IFSC -> OTHER_PII
  enabled: [EMAIL, PHONE_NUMBER, URL, UPI_ID, DATE, AADHAAR, PAN, IFSC]
  base_confidence:
    EMAIL: 0.95
    URL: 0.80
    UPI_ID: 0.80
    PHONE_NUMBER: 0.75
    DATE: 0.55               # many dates are not PII; context (DOB) boosts later
    AADHAAR: 0.70
    PAN: 0.75
    IFSC: 0.70
  validators:                 # optional confidence boosters, not gatekeepers
    aadhaar: true             # 12 digits, first digit 2-9, Verhoeff checksum
    pan: true                 # ABCDE1234F, 4th char = valid holder type (P, C, H, ...)
    phone: true               # Indian mobile: 10 digits starting 6-9 (+91 / 0 prefix ok)
    date: true                # real calendar date, year 1900-2100
    upi: true                 # handle is a known UPI provider (list below)
  validator_boost: 0.20       # capped at 0.99
  validator_penalty: 0.15     # floored at 0.05
  # OCR often reads 0 as O, 1 as I/l, 5 as S, 8 as B inside numbers. Numeric
  # patterns run on a same-length "digit view" of the text where these are
  # corrected only inside digit-heavy chunks, so offsets stay exact.
  ocr_digit_correction: true
  upi_handles: [ybl, ibl, axl, okaxis, oksbi, okhdfcbank, okicici, paytm, upi,
                apl, yapl, rapl, axisbank, icici, sbi, hdfcbank, kotak, idfcbank,
                indus, federal, barodampay, pnb, aubank, jupiteraxis, fbl,
                freecharge, timecosmos, slc, pingpay, abfspay, waaxis, wahdfcbank,
                waicici, wasbi, ikwik, airtel, jio, naviaxis, superyes, kmbl]

# ---------------------------------------------------------------------------
# Name detection [PHASE 5]
# Tuned for PRECISION: a single trie hit is NOT enough (inputs may be newspapers
# where many capitalised words are common nouns). Require agreement of signals.
#
# A "name run" is 1..max_tokens consecutive capitalised / ALL-CAPS words on one
# row. Each run collects weighted signals; it is accepted when the summed score
# reaches min_score. Explicit evidence (a "Name:" label, an honorific, S/O) is
# strong; a dictionary hit is weak. So:
#   "Name: Fooby Barbaz"  label(2)              = 2  -> accepted (unknown name)
#   "Amit Kumar Sharma"   dict(1) + multi(1)    = 2  -> accepted (free text)
#   "Rose Garden"         dict(1)               = 1  -> rejected
#   "New Delhi"           -                     = 0  -> rejected
# ---------------------------------------------------------------------------
names:
  normalize: lowercase        # normalisation before trie lookup
  min_score: 2
  signal_weights:
    context_label: 2          # "Name:", "Father's Name", label on the row above
    relation: 2               # "S/O", "D/O", "W/O", "C/O"
    honorific: 2              # "Mr.", "Smt.", "Dr."
    dictionary: 1             # >= 1 token found in the name lists
    dictionary_multi: 1       # >= 2 tokens found (independent second hit)
  confidence_base: 0.5        # confidence = base + per_point * score (cap 0.99)
  confidence_per_point: 0.12
  max_tokens: 4               # longer capitalised runs are headings, not names
  fuzzy_min_length: 5         # tokens this long may match a list name at edit
                              # distance 1 (OCR: "Sharna" -> "Sharma")
  prefixes: ["mr", "mrs", "ms", "miss", "dr", "shri", "shree", "smt", "sri",
             "kumari", "km", "prof", "late"]
  relation_markers: ["s/o", "d/o", "w/o", "c/o", "son of", "daughter of",
                     "wife of", "husband of", "care of"]
  context_labels: ["name", "full name", "applicant name", "applicant's name",
                   "name of applicant", "father name", "father's name",
                   "mother name", "mother's name", "husband's name",
                   "spouse name", "guardian name", "candidate name",
                   "holder name", "card holder", "account holder",
                   "customer name", "employee name", "student name",
                   "patient name", "nominee", "nominee name"]
  # "<qualifier> Name:" is NOT a person: "Company Name: Acme Corp".
  non_person_qualifiers: ["company", "business", "firm", "bank", "branch",
                          "school", "college", "university", "institute",
                          "organisation", "organization", "shop", "store",
                          "product", "file", "user", "brand", "project",
                          "domain", "host", "device", "village", "city",
                          "district", "state", "street", "building"]
  # Capitalised small words that never start or continue a name run.
  stopwords: ["of", "the", "and", "for", "to", "in", "on", "at", "by", "with",
              "from", "a", "an", "or", "is", "are", "was", "dear", "sir",
              "madam", "india", "government", "republic"]

# ---------------------------------------------------------------------------
# Context rules [PHASE 5]: "<label> <value>" fields on the same row.
# Emits candidates with detector="context_rule"; when they coincide with a regex
# candidate (e.g. a DOB date) the resolver treats that as agreement.
# value kinds (patterns in code): date, year, account, id
# ---------------------------------------------------------------------------
context_rules:
  confidence: 0.80
  # "address_block": rest of the label's row plus continuation rows, stopping at
  # a blank row, a "Something:" label row, or after this many extra rows.
  # (GLiNER alone missed the second line of a 2-line address in testing.)
  address_max_extra_rows: 3
  fields:
    - label: ADDRESS
      value: address_block
      keywords: ["address", "addr", "residential address", "permanent address",
                 "present address", "correspondence address",
                 "communication address", "current address"]
    - label: DATE
      value: date
      keywords: ["dob", "d.o.b", "date of birth", "birth date", "born on"]
    - label: DATE
      value: year
      keywords: ["yob", "year of birth"]
    - label: ACCOUNT_NUMBER
      value: account
      keywords: ["a/c no", "a/c number", "a/c", "account no", "account number",
                 "acct no", "bank account", "account"]
    - label: ID_NUMBER
      value: id
      keywords: ["aadhaar no", "aadhaar number", "aadhaar", "aadhar", "uid",
                 "vid", "pan no", "pan number", "pan", "passport no",
                 "passport number", "passport", "voter id", "epic no",
                 "dl no", "driving licence no", "driving license no",
                 "licence no", "license no", "employee id", "emp id",
                 "roll no", "enrollment no", "enrolment no", "id no"]

# ---------------------------------------------------------------------------
# NER model [PHASE 6]  GLiNER: entity labels are plain-English prompts chosen at
# inference time, so the registry stays configurable.
# Default: GLiNER small v2.1 (Apache-2.0), int8-quantised ONNX build - 183 MB
# download vs 611 MB for the PyTorch weights, small enough for ~1 GB hosts.
# Downloaded once into paths.models_dir on first use; offline afterwards.
# ---------------------------------------------------------------------------
ner:
  enabled: true               # false -> stage reported as "skipped"
  model_id: "onnx-community/gliner_small-v2.1"
  onnx_file: "onnx/model_int8.onnx"   # null -> load PyTorch weights instead
  threshold: 0.5              # drop model predictions below this score
  max_words_per_chunk: 200    # GLiNER reads ~384 tokens; chunks split on rows
  # GLiNER prompt -> registry label. Only what regex / rules handle poorly;
  # structured fields (phone, email, IDs) are left to the regex detector.
  # Prompt wording was compared on synthetic Indian addresses: "address" beat
  # "street address" / "postal address" clearly on recall.
  labels:
    person: PERSON_NAME
    address: ADDRESS
    organization: ORGANIZATION
  # Precision filters on model output (small models over-fire on titles/nouns):
  require_capital_for: [PERSON_NAME, ORGANIZATION]   # drop "farmers" -> ORG
  # A PERSON_NAME span made only of these words (plus names.stopwords) is a
  # title, not a name: drop "The Prime Minister", keep "Minister Rao".
  non_name_words: ["prime", "minister", "chief", "president", "vice", "chairman",
                   "chairperson", "director", "manager", "officer", "secretary",
                   "governor", "judge", "justice", "doctor", "professor", "sir",
                   "madam", "mr", "mrs", "ms", "dr", "shri", "smt", "applicant",
                   "candidate", "customer", "holder", "member", "head", "general",
                   "deputy", "senior", "junior", "police", "commissioner",
                   "collector", "inspector", "editor", "reporter", "spokesperson"]

# ---------------------------------------------------------------------------
# Entity resolution [PHASE 7]  (weights are tunable and eval-driven, not fixed)
# ---------------------------------------------------------------------------
# Candidates with the same label and overlapping spans form one entity. Score:
#     final = 1 - PRODUCT(1 - weight[detector] * confidence)
# (noisy-OR). Independent detectors that agree push confidence up; repeats from
# the SAME detector count once (its best candidate). Worked examples:
#   DOB date      regex .75*.95=.71 + context .80*.70=.56 -> .87  (kept, >= .80)
#   date alone    regex .71                               -> .71  (dropped, < .80)
#   "Name: Fooby" context_rule .74*.70                    -> .52  (kept)
#   dict-only name name_trie .74*.55                      -> .41  (dropped unless
#                 GLiNER agrees: + .91*.80 -> .84)
# (Format validators are not a separate weight: Phase 4 already folds a pass /
# fail into the regex candidate's own confidence.)
# ---------------------------------------------------------------------------
resolver:
  detector_weights:
    regex: 0.95
    gliner: 0.80
    name_trie: 0.55
    context_rule: 0.70
  min_final_confidence: 0.50
  min_confidence_by_label:
    DATE: 0.80                # a bare date is rarely PII; DOB context lifts it
    ADDRESS: 0.40             # addresses are sensitive - favour recall
  # Different labels on overlapping text: keep the winner, drop the loser only if
  # at least overlap_min_fraction of the LOSER is covered (partial overlaps keep
  # both, so nothing outside the winner goes unredacted). Dropped candidates are
  # recorded on the winner for the audit trail.
  overlap_strategy: "highest_score"   # or "longest_span"
  overlap_min_fraction: 0.5
  # GLiNER returns addresses in pieces ("House No 45", "Sector 12", "Dwarka").
  merge:
    labels: [ADDRESS]               # join same-label pieces separated only by
    max_gap_chars: 4                # , . - / or whitespace (incl. line breaks)
    absorb_labels: [ORGANIZATION]   # "Flat 3B, <Lake View Apartments>, Banjara Hills"
    attach_pin_code: true           # extend over a trailing 6-digit Indian PIN

# ---------------------------------------------------------------------------
# Spatial mapping [PHASE 7]: entity char span -> word tokens -> one box per line.
# Partial words get interpolated sub-word boxes ("DOB:01/01/1990" -> date only).
# ---------------------------------------------------------------------------
mapping:
  padding_px: 2               # grow boxes so interpolation never clips glyph edges

# ---------------------------------------------------------------------------
# Visualization / redaction [PHASE 7-8]
# ---------------------------------------------------------------------------
visualization:
  box_thickness: 2
  font_scale: 0.45
  draw_labels: true
  ocr_line_color: [0, 140, 255]   # BGR; Phase 2 line boxes (orange)
  ocr_word_color: [200, 120, 0]   # BGR; Phase 3 word boxes (blue)
  colors:                     # BGR; configurable per class
    PERSON_NAME:   [0, 180, 0]
    EMAIL:         [0, 0, 220]
    PHONE_NUMBER:  [0, 0, 0]
    URL:           [220, 0, 0]
    UPI_ID:        [180, 0, 180]
    ID_NUMBER:     [0, 140, 220]
    ACCOUNT_NUMBER: [0, 140, 220]
    DATE:          [120, 120, 0]
    ADDRESS:       [80, 80, 200]
    ORGANIZATION:  [200, 120, 0]
    OTHER_PII:     [128, 128, 128]
  default_color: [128, 128, 128]
  redaction_fill: [0, 0, 0]   # opaque black for true redaction

# ---------------------------------------------------------------------------
# Web UI [PHASE 9]  (upload size limit itself lives in .streamlit/config.toml)
# ---------------------------------------------------------------------------
ui:
  allowed_types: ["jpg", "jpeg", "png", "bmp", "webp"]

logging:
  level: "INFO"
